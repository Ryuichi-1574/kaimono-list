<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e6b">
<title>買い物リスト</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <select id="listSelect" aria-label="リスト切替"></select>
  <button class="icon-btn" data-action="open-share" aria-label="共有">📤</button>
  <button class="icon-btn" data-action="open-spend" aria-label="支出">💴</button>
  <button class="icon-btn" data-action="open-settings" aria-label="設定">⚙️</button>
</header>

<div id="syncState" class="sync" aria-live="polite"></div>

<form id="addForm" class="add">
  <input id="addName" type="text" list="nameList" placeholder="品目を追加" autocomplete="off" required>
  <datalist id="nameList"></datalist>
  <input id="addQty" type="number" min="1" value="1" inputmode="numeric" aria-label="数量">
  <select id="addCat" aria-label="カテゴリ"></select>
  <button class="primary" type="submit">追加</button>
</form>

<div class="filter">
  <input id="search" type="search" placeholder="検索" aria-label="品目を検索" autocomplete="off">
  <select id="sortSelect" aria-label="並べ替え">
    <option value="category">カテゴリ順</option>
    <option value="name">名前順</option>
    <option value="new">追加が新しい順</option>
  </select>
</div>

<div id="due"></div>
<main id="list"></main>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<footer class="bottom">
  <div class="total">購入合計 <strong id="total">¥0</strong></div>
  <button id="readdBtn" data-action="readd">購入済みを再追加</button>
</footer>

<dialog id="dlg"></dialog>

<script src="storage.js"></script>
<script src="app.js"></script>
<script type="module" src="cloud.js"></script>
</body>
</html>
